# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  deploy:tofu:
    taskfile: ./deploy/tofu/Taskfile.yml
    dir: ./deploy/tofu/

vars:
  GREETING: Hello, World!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true
