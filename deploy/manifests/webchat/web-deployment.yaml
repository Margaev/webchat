apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - image: localhost:5001/web:0.1.0
          name: web
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
