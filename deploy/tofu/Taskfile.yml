# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  _apply:
    internal: true
    dir: "{{.DIR}}"
    requires:
      vars: [DIR]
    cmds:
      - tofu apply -auto-approve

  apply-infra:
    desc: Apply infrastructure module
    cmds:
      - task: _apply
        vars: { DIR: "./infra" }

  apply-gitops:
    desc: Apply gitops module
    cmds:
      - task: _apply
        vars: { DIR: "./gitops" }

  apply-all:
    desc: Apply all modules in order
    cmds:
      - task: apply-infra
      - task: apply-gitops

  get-argo-password:
    cmds:
      - kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
    silent: true
